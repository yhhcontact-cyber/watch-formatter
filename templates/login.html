<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員登入 | 名錶整理台</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e7ebf0; color: #1c2430; font-family: "Segoe UI", "PingFang HK", sans-serif; }
  form { width: min(420px, calc(100% - 32px)); background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 10px 30px rgba(20, 30, 40, .08); }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 18px; color: #5c6775; font-size: 14px; }
  label { display: block; margin: 12px 0 6px; font-size: 13px; }
  input { width: 100%; box-sizing: border-box; border: 1px solid #d5dbe3; border-radius: 8px; padding: 12px; font-size: 15px; }
  button { width: 100%; margin-top: 18px; border: 0; border-radius: 8px; padding: 12px; background: #178a62; color: white; font-weight: 700; font-size: 15px; }
  .error { background: #fff1f0; color: #9f2d2d; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
</style>
</head>
<body>
<form method="post">
  <h1>名錶供應商整理台</h1>
  <p>使用 Watch Hub 的會員帳號登入。</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <label>帳號</label>
  <input name="username" autocomplete="username" required>
  <label>密碼</label>
  <input name="password" type="password" autocomplete="current-password" required>
  <button type="submit">登入</button>
</form>
</body>
</html>
