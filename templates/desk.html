<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名錶供應商整理台</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden; background: #e7ebf0; color: #1c2430; font-family: "Segoe UI", "PingFang HK", sans-serif; }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing-row { cursor: row-resize; user-select: none; }
  header { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 18px; background: #17202b; color: white; position: relative; }
  #memberToggle { border: 0; border-radius: 8px; padding: 8px 12px; background: #178a62; color: white; font-weight: 700; cursor: pointer; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header a, header label { color: #d7e0ea; font-size: 13px; }
  .member-panel { position: absolute; top: 58px; right: 18px; z-index: 5; width: min(320px, calc(100% - 24px)); max-height: 320px; overflow: auto; background: white; color: #1c2430; border-radius: 12px; padding: 12px; box-shadow: 0 10px 30px rgba(20, 30, 40, .16); }
  .member-panel label { display: flex; gap: 8px; align-items: center; color: #1c2430; padding: 4px 0; }
  .tool button, .quotes button, .add button, .remove { border: 0; border-radius: 8px; padding: 8px 12px; background: #178a62; color: white; font-weight: 700; cursor: pointer; }
  .remove { background: #f3f4f6; color: #9f2d2d; padding: 0 10px; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0; padding: 12px; }
  .supplier-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; }
  .supplier-head h2, .supplier-head .row { margin: 0; }
  #supplierList { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; overflow-x: hidden; overflow-y: auto; padding-top: 8px; }
  .add { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .add h2 { margin: 0; white-space: nowrap; }
  .add input { width: 140px; margin: 0; }
  #panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 1fr) 14px 420px; align-items: stretch; }
  .split { cursor: col-resize; touch-action: none; position: relative; }
  .split::before { content: ""; position: absolute; top: 16px; bottom: 16px; left: 6px; width: 2px; border-radius: 2px; background: #b7c2ce; }
  .split:hover::before, body.resizing .split::before { background: #178a62; width: 3px; left: 5px; }
  .split-row { height: 14px; cursor: row-resize; touch-action: none; position: relative; flex: none; }
  .split-row::before { content: ""; position: absolute; left: 18px; right: 18px; top: 6px; height: 2px; border-radius: 2px; background: #b7c2ce; }
  .split-row:hover::before, body.resizing-row .split-row::before { background: #178a62; height: 3px; top: 5px; }
  section { background: white; border-radius: 14px; padding: 12px; min-height: 0; overflow: auto; }
  section.suppliers { display: flex; flex-direction: column; height: 156px; overflow: hidden; padding: 10px 12px 8px; }
  h2 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .step { width: 22px; height: 22px; border-radius: 50%; background: #17202b; color: white; display: inline-grid; place-items: center; font-size: 12px; flex: none; }
  .supplier { width: auto; text-align: left; border: 1px solid #e4e8ee; background: #f8fafb; border-radius: 8px; padding: 4px 8px; cursor: pointer; line-height: 1.25; }
  .supplier-row { display: flex; gap: 4px; align-items: center; flex: 0 0 auto; width: max-content; max-width: 100%; }
  .supplier-row .supplier { flex: 0 0 auto; }
  .supplier strong { display: block; font-size: 13px; }
  .supplier span { color: #667384; font-size: 12px; }
  .supplier.selected { border-color: #178a62; background: #f1faf6; }
  .brand { margin-top: 14px; }
  .brand h3 { margin: 0 0 6px; font-size: 14px; color: #178a62; }
  .item { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding: 7px 0; border-bottom: 1px solid #eef2f6; font-size: 13px; }
  .posted { display: block; margin-top: 2px; color: #667384; }
  .item b { font-size: 14px; }
  .raw { white-space: pre-wrap; word-break: break-word; }
  .muted { color: #667384; }
  textarea, .output { width: 100%; min-height: 180px; border: 1px solid #d5dbe3; border-radius: 8px; padding: 10px; font: 13px/1.5 Consolas, "Courier New", monospace; }
  .output { background: #f7f8fa; white-space: pre-wrap; }
  .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .add input { border: 1px solid #d5dbe3; border-radius: 8px; padding: 8px; }
  .archive { display: block; width: 100%; text-align: left; border: 0; background: #f6f8fa; border-radius: 8px; padding: 8px; margin-top: 6px; cursor: pointer; }
  .status { min-height: 18px; color: #9f2d2d; font-size: 13px; }
  @media (max-width: 980px) {
    body { overflow: auto; }
    main { display: block; height: auto; }
    #panes { display: block; height: auto; }
    .add { margin-left: 0; }
    .add input { width: 100%; }
    .split, .split-row { display: none; }
    section.suppliers { height: auto !important; overflow: visible; }
    #supplierList { overflow: visible; }
    section { min-height: 240px; overflow: visible; margin-bottom: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>名錶供應商整理台</h1>
  {% if username == 'admin' %}
  <div>
    <button type="button" id="memberToggle">指定可進入的會員</button>
    <div id="memberPanel" class="member-panel" hidden>
      <div class="row">
        <button type="button" id="memberAll">全選</button>
        <button type="button" id="memberSave">儲存</button>
      </div>
      <div id="memberList"></div>
    </div>
  </div>
  {% endif %}
  <div>{{ username }} · <a href="{{ url_for('logout') }}">登出</a></div>
</header>
<main id="board">
  <section class="suppliers">
    <div class="supplier-head">
      <h2><span class="step">1</span>指定供應商</h2>
      <div class="row">
        <button type="button" id="selectSuppliers">全選</button>
        <button type="button" id="deleteSuppliers">刪除所選</button>
      </div>
      <form class="add" id="addSupplier">
        <h2>加入供應商</h2>
        <input name="name" placeholder="顯示名稱" required>
        <input name="phone" placeholder="+852..." required>
        <button type="submit">加入</button>
      </form>
    </div>
    <div id="supplierList"></div>
  </section>
  <div class="split-row" id="supplierSplit"></div>
  <div id="panes">
  <section class="quotes">
    <h2><span class="step">2</span><span id="quoteTitle">選擇上面一位供應商</span></h2>
    <div class="row">
      <button type="button" id="selectAll">全選</button>
      <button type="button" id="copyRaw">複製原文</button>
      <button type="button" id="sendTool">放入整理工具</button>
    </div>
    <div id="quoteBoard"></div>
  </section>
  <div class="split" data-split="right"></div>
  <section class="tool">
    <h2><span class="step">3</span>名錶資料自動排列</h2>
    <p class="muted">勾選的報價會變成整理工具的原始行。整理後可以存檔。</p>
    <textarea id="inputData" placeholder="也可以直接貼上未整理的報價..."></textarea>
    <div class="row">
      <button type="button" onclick="processWatchData()">智慧格式化與分類</button>
      <button type="button" onclick="copyResult()">複製結果</button>
      <button type="button" id="saveSheet">存檔</button>
    </div>
    <div id="outputResult" class="output">等待整理資料...</div>
    <p class="status" id="status"></p>
    <h2>已存檔</h2>
    <div id="archives"></div>
  </section>
  </div>
</main>
<script src="{{ url_for('static', filename='formatter.js') }}"></script>
<script>
const state = { phone: "", name: "", items: [] };

function esc(value) {
  return String(value || "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

async function loadSuppliers() {
  const res = await fetch("/api/suppliers");
  if (res.status === 401 || res.status === 403) { location.href = "/login"; return; }
  const data = await res.json();
  const box = document.getElementById("supplierList");
  box.innerHTML = data.suppliers.map(person => `
    <div class="supplier-row">
      <input type="checkbox" class="supplier-check" data-phone="${esc(person.phone)}" data-name="${esc(person.name)}">
      <button type="button" class="supplier${person.phone === state.phone ? " selected" : ""}" data-phone="${esc(person.phone)}">
        <strong>${esc(person.name)}</strong>
        <span>${esc(person.phone)}</span>
      </button>
    </div>
  `).join("");
  box.querySelectorAll(".supplier").forEach(button => {
    button.onclick = () => loadQuotes(button.dataset.phone);
  });
}

document.getElementById("selectSuppliers").onclick = () => {
  const boxes = [...document.querySelectorAll(".supplier-check")];
  const check = boxes.some(box => !box.checked);
  boxes.forEach(box => { box.checked = check; });
};

document.getElementById("deleteSuppliers").onclick = async () => {
  const phones = [...document.querySelectorAll(".supplier-check:checked")].map(box => box.dataset.phone);
  const status = document.getElementById("status");
  if (!phones.length) { status.textContent = "請先勾選要刪除的供應商。"; return; }
  if (!confirm("刪除所選的 " + phones.length + " 位供應商？其他會員也不會再看到。")) return;
  const res = await fetch("/api/suppliers", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ phones })
  });
  const data = await res.json();
  status.textContent = data.error || ("已刪除 " + (data.removed || phones.length) + " 位供應商。");
  if (res.ok && phones.includes(state.phone)) {
    state.phone = "";
    document.getElementById("quoteBoard").innerHTML = "";
    document.getElementById("quoteTitle").textContent = "選擇上面一位供應商";
  }
  if (res.ok) loadSuppliers();
};

async function loadQuotes(phone) {
  state.phone = phone;
  const res = await fetch("/api/quotes?phone=" + encodeURIComponent(phone));
  const data = await res.json();
  state.name = data.name || "";
  state.items = [];
  const total = (data.brands || []).reduce((sum, group) => sum + group.items.length, 0);
  document.getElementById("quoteTitle").textContent = (data.name || "供應商") + " · " + total + " 款 · 24小時內";
  const quoteBoard = document.getElementById("quoteBoard");
  quoteBoard.innerHTML = (data.brands || []).map(group => `
    <div class="brand">
      <h3>${esc(group.brand)} · ${group.items.length}</h3>
      ${group.items.map(item => {
        const index = state.items.push(item) - 1;
        return `<label class="item">
          <input type="checkbox" data-index="${index}" checked>
          <span class="raw">${esc(item.raw || item.line)}<span class="posted">發報時間 ${esc(item.time)}</span></span>
        </label>`;
      }).join("")}
    </div>
  `).join("") || "<p class='muted'>這位供應商過去 24 小時沒有清單。</p>";
  loadSuppliers();
}

document.getElementById("selectAll").onclick = () => {
  const boxes = [...document.querySelectorAll("#quoteBoard input")];
  const check = boxes.some(box => !box.checked);
  boxes.forEach(box => { box.checked = check; });
};

function chosenItems() {
  return [...document.querySelectorAll("#quoteBoard input:checked")]
    .map(box => state.items[Number(box.dataset.index)])
    .filter(Boolean);
}

document.getElementById("copyRaw").onclick = async () => {
  const text = chosenItems().map(item => {
    const raw = item.raw || item.line || "";
    return item.time ? raw + "\n發報時間 " + item.time : raw;
  }).filter(Boolean).join("\n");
  const status = document.getElementById("status");
  if (!text) { status.textContent = "請先勾選報價。"; return; }
  try {
    await navigator.clipboard.writeText(text);
    status.textContent = "已複製原文。";
  } catch (err) {
    status.textContent = "瀏覽器沒有允許複製，請再按一次。";
  }
};

document.getElementById("sendTool").onclick = () => {
  const chosen = chosenItems();
  if (!chosen.length) { document.getElementById("status").textContent = "請先勾選報價。"; return; }
  const lines = [];
  let header = "";
  chosen.forEach(item => {
    if (item.header !== header) {
      lines.push(item.header);
      header = item.header;
    }
    lines.push(item.line);
  });
  document.getElementById("inputData").value = lines.join("\n");
  processWatchData();
  document.getElementById("status").textContent = "";
};

document.getElementById("saveSheet").onclick = async () => {
  const status = document.getElementById("status");
  const res = await fetch("/api/archives", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      supplier_phone: state.phone,
      supplier_name: state.name,
      source_text: document.getElementById("inputData").value,
      result_text: document.getElementById("outputResult").innerText
    })
  });
  const data = await res.json();
  status.textContent = data.error || ("已存檔 " + (data.created_at || ""));
  if (res.ok) loadArchives();
};

async function loadArchives() {
  const res = await fetch("/api/archives");
  if (!res.ok) return;
  const data = await res.json();
  document.getElementById("archives").innerHTML = (data.archives || []).map(sheet => `
    <button type="button" class="archive" data-id="${sheet.id}">
      <b>${esc(sheet.supplier_name || "未指定供應商")}</b>
      <span class="muted"> ${esc(sheet.created_at)}</span>
    </button>
  `).join("") || "<p class='muted'>還沒有存檔。</p>";
  document.querySelectorAll(".archive").forEach(button => {
    button.onclick = async () => {
      const detail = await fetch("/api/archives/" + button.dataset.id);
      const sheet = await detail.json();
      document.getElementById("inputData").value = sheet.source_text || "";
      document.getElementById("outputResult").innerText = sheet.result_text || "";
    };
  });
}

document.getElementById("addSupplier").onsubmit = async event => {
  event.preventDefault();
  const form = event.target;
  const res = await fetch("/api/suppliers", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: form.name.value, phone: form.phone.value })
  });
  const data = await res.json();
  document.getElementById("status").textContent = data.error || "已加入供應商。";
  if (res.ok) { form.reset(); loadSuppliers(); }
};

loadSuppliers();
loadArchives();

const panes = document.getElementById("panes");
function readCols() {
  try { return JSON.parse(localStorage.getItem("formatter-cols")) || { right: 420 }; }
  catch (err) { return { right: 420 }; }
}
function applyCols(cols) {
  const width = panes.clientWidth || 1100;
  const minQuotes = 280;
  const minTool = 280;
  let right = Math.max(minTool, Number(cols.right) || 420);
  right = Math.min(right, Math.max(minTool, width - 14 - minQuotes));
  cols.right = Math.round(right);
  panes.style.gridTemplateColumns = "minmax(280px,1fr) 14px " + cols.right + "px";
}
applyCols(readCols());
const supplierPane = document.querySelector(".suppliers");
function readSupplierHeight() {
  const saved = Number(localStorage.getItem("formatter-supplier-h"));
  return saved || 156;
}
function applySupplierHeight(height) {
  const board = document.getElementById("board");
  const max = Math.max(120, (board.clientHeight || 700) - 220);
  const next = Math.max(92, Math.min(Math.round(height), max));
  supplierPane.style.height = next + "px";
  return next;
}
applySupplierHeight(readSupplierHeight());
window.addEventListener("resize", () => {
  applyCols(readCols());
  applySupplierHeight(readSupplierHeight());
});
const supplierSplit = document.getElementById("supplierSplit");
supplierSplit.onpointerdown = event => {
  if (event.button !== 0) return;
  event.preventDefault();
  try { supplierSplit.setPointerCapture(event.pointerId); } catch (err) {}
  const startY = event.clientY;
  const startHeight = supplierPane.getBoundingClientRect().height;
  document.body.classList.add("resizing-row");
  function move(ev) {
    applySupplierHeight(startHeight + (ev.clientY - startY));
  }
  function up() {
    localStorage.setItem("formatter-supplier-h", String(Math.round(supplierPane.getBoundingClientRect().height)));
    document.body.classList.remove("resizing-row");
    supplierSplit.removeEventListener("pointermove", move);
    supplierSplit.removeEventListener("pointerup", up);
    supplierSplit.removeEventListener("pointercancel", up);
  }
  supplierSplit.addEventListener("pointermove", move);
  supplierSplit.addEventListener("pointerup", up);
  supplierSplit.addEventListener("pointercancel", up);
};
document.querySelectorAll(".split").forEach(bar => {
  bar.onpointerdown = event => {
    if (event.button !== 0) return;
    event.preventDefault();
    try { bar.setPointerCapture(event.pointerId); } catch (err) {}
    const cols = readCols();
    const startX = event.clientX;
    const startRight = cols.right;
    document.body.classList.add("resizing");
    function move(ev) {
      cols.right = startRight - (ev.clientX - startX);
      applyCols(cols);
    }
    function up() {
      localStorage.setItem("formatter-cols", JSON.stringify({ right: cols.right }));
      document.body.classList.remove("resizing");
      bar.removeEventListener("pointermove", move);
      bar.removeEventListener("pointerup", up);
      bar.removeEventListener("pointercancel", up);
    }
    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", up);
    bar.addEventListener("pointercancel", up);
  };
});

const memberToggle = document.getElementById("memberToggle");
const memberPanel = document.getElementById("memberPanel");
if (memberToggle && memberPanel) {
  memberToggle.onclick = async () => {
    memberPanel.hidden = !memberPanel.hidden;
    if (memberPanel.hidden) return;
    const res = await fetch("/api/access");
    const data = await res.json();
    document.getElementById("memberList").innerHTML = (data.members || []).map(member => `
      <label><input type="checkbox" class="member-check" value="${esc(member.username)}" ${member.allowed ? "checked" : ""}> ${esc(member.username)}</label>
    `).join("") || "<p class='muted'>還沒有其他會員。</p>";
  };
  document.getElementById("memberAll").onclick = () => {
    const boxes = [...document.querySelectorAll(".member-check")];
    const check = boxes.some(box => !box.checked);
    boxes.forEach(box => { box.checked = check; });
  };
  document.getElementById("memberSave").onclick = async () => {
    const usernames = [...document.querySelectorAll(".member-check:checked")].map(box => box.value);
    const res = await fetch("/api/access", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usernames })
    });
    const data = await res.json();
    document.getElementById("status").textContent = data.error || ("已指定 " + usernames.length + " 位會員可以進入。");
  };
}
</script>
</body>
</html>
