<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名錶供應商整理台</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e7ebf0; color: #1c2430; font-family: "Segoe UI", "PingFang HK", sans-serif; }
  header { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 18px; background: #17202b; color: white; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header a { color: #d7e0ea; font-size: 13px; }
  .days { display: flex; gap: 6px; }
  .days button, .tool button, .quotes button, .add button { border: 0; border-radius: 8px; padding: 8px 12px; background: #178a62; color: white; font-weight: 700; cursor: pointer; }
  .days button.active { background: #d7b15e; color: #1c2430; }
  main { display: grid; grid-template-columns: 260px minmax(0, 1fr) 380px; gap: 12px; padding: 12px; align-items: start; }
  section { background: white; border-radius: 14px; padding: 12px; min-height: 240px; }
  h2 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .step { width: 22px; height: 22px; border-radius: 50%; background: #17202b; color: white; display: inline-grid; place-items: center; font-size: 12px; flex: none; }
  .supplier { width: 100%; text-align: left; border: 1px solid #e4e8ee; background: #f8fafb; border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
  .supplier strong { display: block; }
  .supplier span { color: #667384; font-size: 12px; }
  .supplier.selected { border-color: #178a62; background: #f1faf6; }
  .brand { margin-top: 14px; }
  .brand h3 { margin: 0 0 6px; font-size: 14px; color: #178a62; }
  .item { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start; padding: 7px 0; border-bottom: 1px solid #eef2f6; font-size: 13px; }
  .item b { font-size: 14px; }
  .raw { white-space: pre-wrap; word-break: break-word; }
  .muted { color: #667384; }
  textarea, .output { width: 100%; min-height: 180px; border: 1px solid #d5dbe3; border-radius: 8px; padding: 10px; font: 13px/1.5 Consolas, "Courier New", monospace; }
  .output { background: #f7f8fa; white-space: pre-wrap; }
  .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .add input { width: 100%; margin-bottom: 6px; border: 1px solid #d5dbe3; border-radius: 8px; padding: 8px; }
  .archive { display: block; width: 100%; text-align: left; border: 0; background: #f6f8fa; border-radius: 8px; padding: 8px; margin-top: 6px; cursor: pointer; }
  .status { min-height: 18px; color: #9f2d2d; font-size: 13px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>名錶供應商整理台</h1>
  <div class="days">
    <button type="button" data-days="7">7 日</button>
    <button type="button" data-days="30" class="active">30 日</button>
    <button type="button" data-days="90">90 日</button>
  </div>
  <div>{{ username }} · <a href="{{ url_for('logout') }}">登出</a></div>
</header>
<main>
  <section>
    <h2><span class="step">1</span>指定供應商</h2>
    <div id="supplierList"></div>
    <form class="add" id="addSupplier">
      <h2>加入供應商</h2>
      <input name="name" placeholder="顯示名稱" required>
      <input name="phone" placeholder="+852..." required>
      <button type="submit">加入</button>
    </form>
  </section>
  <section class="quotes">
    <h2><span class="step">2</span><span id="quoteTitle">選擇左邊一位供應商</span></h2>
    <div class="row">
      <button type="button" id="selectAll">全選</button>
      <button type="button" id="copyRaw">複製原文</button>
      <button type="button" id="sendTool">放入整理工具</button>
    </div>
    <div id="quoteBoard"></div>
  </section>
  <section class="tool">
    <h2><span class="step">3</span>名錶資料自動排列</h2>
    <p class="muted">左邊勾選的報價會變成整理工具的原始行。整理後可以存檔。</p>
    <textarea id="inputData" placeholder="也可以直接貼上未整理的報價..."></textarea>
    <div class="row">
      <button type="button" onclick="processWatchData()">智慧格式化與分類</button>
      <button type="button" onclick="copyResult()">複製結果</button>
      <button type="button" id="saveSheet">存檔</button>
    </div>
    <div id="outputResult" class="output">等待整理資料...</div>
    <p class="status" id="status"></p>
    <h2>已存檔</h2>
    <div id="archives"></div>
  </section>
</main>
<script src="{{ url_for('static', filename='formatter.js') }}"></script>
<script>
const state = { days: "30", phone: "", name: "", items: [] };

function esc(value) {
  return String(value || "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

async function loadSuppliers() {
  const res = await fetch("/api/suppliers?days=" + state.days);
  if (res.status === 401) { location.href = "/login"; return; }
  const data = await res.json();
  const box = document.getElementById("supplierList");
  box.innerHTML = data.suppliers.map(person => `
    <button type="button" class="supplier${person.phone === state.phone ? " selected" : ""}" data-phone="${esc(person.phone)}">
      <strong>${esc(person.name)}</strong>
      <span>${esc(person.phone)}</span>
    </button>
  `).join("");
  box.querySelectorAll(".supplier").forEach(button => {
    button.onclick = () => loadQuotes(button.dataset.phone);
  });
}

async function loadQuotes(phone) {
  state.phone = phone;
  const res = await fetch("/api/quotes?phone=" + encodeURIComponent(phone) + "&days=" + state.days);
  const data = await res.json();
  state.name = data.name || "";
  state.items = [];
  const total = (data.brands || []).reduce((sum, group) => sum + group.items.length, 0);
  document.getElementById("quoteTitle").textContent = (data.name || "供應商") + " · " + total + " 款";
  const board = document.getElementById("quoteBoard");
  board.innerHTML = (data.brands || []).map(group => `
    <div class="brand">
      <h3>${esc(group.brand)} · ${group.items.length}</h3>
      ${group.items.map(item => {
        const index = state.items.push(item) - 1;
        return `<label class="item">
          <input type="checkbox" data-index="${index}" checked>
          <span class="raw">${esc(item.raw || item.line)}</span>
          <span class="muted">${esc(item.model)}<br>${esc(item.price)}</span>
        </label>`;
      }).join("")}
    </div>
  `).join("") || "<p class='muted'>這段期間沒有報價。</p>";
  loadSuppliers();
}

document.querySelectorAll(".days button").forEach(button => {
  button.onclick = () => {
    document.querySelectorAll(".days button").forEach(item => item.classList.remove("active"));
    button.classList.add("active");
    state.days = button.dataset.days;
    loadSuppliers();
    if (state.phone) loadQuotes(state.phone);
  };
});

document.getElementById("selectAll").onclick = () => {
  const boxes = [...document.querySelectorAll("#quoteBoard input")];
  const check = boxes.some(box => !box.checked);
  boxes.forEach(box => { box.checked = check; });
};

function chosenItems() {
  return [...document.querySelectorAll("#quoteBoard input:checked")]
    .map(box => state.items[Number(box.dataset.index)])
    .filter(Boolean);
}

document.getElementById("copyRaw").onclick = async () => {
  const text = chosenItems().map(item => item.raw || item.line).filter(Boolean).join("\n");
  const status = document.getElementById("status");
  if (!text) { status.textContent = "請先勾選報價。"; return; }
  try {
    await navigator.clipboard.writeText(text);
    status.textContent = "已複製原文。";
  } catch (err) {
    status.textContent = "瀏覽器沒有允許複製，請再按一次。";
  }
};

document.getElementById("sendTool").onclick = () => {
  const chosen = chosenItems();
  if (!chosen.length) { document.getElementById("status").textContent = "請先勾選報價。"; return; }
  const lines = [];
  let header = "";
  chosen.forEach(item => {
    if (item.header !== header) {
      lines.push(item.header);
      header = item.header;
    }
    lines.push(item.line);
  });
  document.getElementById("inputData").value = lines.join("\n");
  processWatchData();
  document.getElementById("status").textContent = "";
};

document.getElementById("saveSheet").onclick = async () => {
  const status = document.getElementById("status");
  const res = await fetch("/api/archives", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      supplier_phone: state.phone,
      supplier_name: state.name,
      source_text: document.getElementById("inputData").value,
      result_text: document.getElementById("outputResult").innerText
    })
  });
  const data = await res.json();
  status.textContent = data.error || ("已存檔 " + (data.created_at || ""));
  if (res.ok) loadArchives();
};

async function loadArchives() {
  const res = await fetch("/api/archives");
  if (!res.ok) return;
  const data = await res.json();
  document.getElementById("archives").innerHTML = (data.archives || []).map(sheet => `
    <button type="button" class="archive" data-id="${sheet.id}">
      <b>${esc(sheet.supplier_name || "未指定供應商")}</b>
      <span class="muted"> ${esc(sheet.created_at)}</span>
    </button>
  `).join("") || "<p class='muted'>還沒有存檔。</p>";
  document.querySelectorAll(".archive").forEach(button => {
    button.onclick = async () => {
      const detail = await fetch("/api/archives/" + button.dataset.id);
      const sheet = await detail.json();
      document.getElementById("inputData").value = sheet.source_text || "";
      document.getElementById("outputResult").innerText = sheet.result_text || "";
    };
  });
}

document.getElementById("addSupplier").onsubmit = async event => {
  event.preventDefault();
  const form = event.target;
  const res = await fetch("/api/suppliers", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: form.name.value, phone: form.phone.value })
  });
  const data = await res.json();
  document.getElementById("status").textContent = data.error || "已加入供應商。";
  if (res.ok) { form.reset(); loadSuppliers(); }
};

loadSuppliers();
loadArchives();
</script>
</body>
</html>
