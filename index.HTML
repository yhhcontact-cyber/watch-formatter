<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名錶資料智慧標準化工具 v16.0</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #e5e9f0;
            color: #333;
        }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; line-height: 1.4; }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        textarea {
            width: 100%;
            height: 480px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
            background-color: #fafafa;
            resize: vertical;
        }
        .btn-group {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background-color: #17b978;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover { background-color: #119961; }
        button.copy-btn {
            background-color: #2c3e50;
            padding: 6px 15px;
            font-size: 13px;
            float: right;
            margin-bottom: 10px;
        }
        button.copy-btn:hover { background-color: #17b978; }
        .output-box {
            background-color: #f8f9fa;
            border: 1px dashed #2c3e50;
            padding: 15px;
            border-radius: 6px;
            min-height: 450px;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 1.6;
            clear: both;
        }
        .note {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
            line-height: 1.4;
        }
        
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            body { margin: 15px auto; padding: 0 10px; }
            .container { padding: 15px; }
            textarea { height: 300px; }
            .output-box { min-height: 300px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛡️ v16.0 型號整理終極版本 ⌚ 名錶資料自動排列工具</h2>
    
    <div class="grid">
        <div>
            <p><strong>1. 請貼上未整理的原始資料：</strong></p>
            <textarea id="inputData" placeholder="支援輸入品牌抬頭（如 ROLEX, PP, VC, AP, RM, TUDOR）以及各類手錶型號報價..."></textarea>
            <div class="note">* v16.0 更新：屬性絕對分離（顏色與錶帶不混淆）、支援多世代型號、修正K單位計價邏輯與動態年份。</div>
        </div>
        
        <div>
            <p>
                <strong>2. 統一標準化輸出結果：</strong>
                <button class="copy-btn" onclick="copyResult()">一鍵複製結果</button>
            </p>
            <div id="outputResult" class="output-box">等待整理資料...</div>
        </div>
    </div>
    
    <div class="btn-group">
        <button onclick="processWatchData()">✨ 智慧格式化與分類</button>
    </div>
</div>

<script>
const WATCH_RULES = [
    // === Cartier 卡地亞系列 ===
    { cat: "Ballon Bleu", reg: /^(WE|WSBB|W69|W2BB|W3BB|WJBB|WGBB)/i }, 
    { cat: "Baignoire", reg: /^(WGBA)/i },
    { cat: "Panthere De Cartier", reg: /^(W4PN|WJPN|WSPN|WGPN|W2PN)/i },
    { cat: "Pasha De Cartier", reg: /^(WSPA|WGPA|WJPA|W2PA)/i },
    { cat: "Ronde Must De Cartier", reg: /^(WSRN)/i },
    { cat: "Santos", reg: /^(WSSA|W2SA|WGSA|WHSA)/i }, 
    { cat: "Tank", reg: /^(W531|WSTA|WGTA|W4TA)/i },

    // === Tudor 帝舵系列 ===
    { cat: "Monarch", reg: /^(2639)/ }, 
    { cat: "Tudor Royal", reg: /^(28)/ },
    { cat: "Black Bay", reg: /^(7941)/ },
    { cat: "Black Bay 54", reg: /^(790)/ },
    { cat: "Black Bay 58", reg: /^(7939)/ },
    { cat: "Black Bay 68", reg: /^(7943)/ },
    { cat: "Black Bay one", reg: /^(796)/ },
    { cat: "Black Bay chrono", reg: /^(7936)/ },
    { cat: "Pelagos", reg: /^(25)/ },
    { cat: "Clair de rose", reg: /^(35)/ },
    { cat: "1926 Luna", reg: /^(91)/ },
    { cat: "Black Bay GMT", reg: /^(798)/ },
    { cat: "Black Bay Bronze", reg: /^(792)/ },
    { cat: "Black Bay Pro", reg: /^(7947)/ },
    { cat: "Ranger", reg: /^(799)/ },

    // === Rolex 勞力士系列 (已放寬涵蓋舊世代) ===
    { cat: "DeepSea", reg: /^\d?(13666|12666|12606|11666)/ },
    { cat: "Submariner", reg: /^\d?(12406|12661|11661|11406|1661|1406)/ },
    { cat: "Yacht-Master", reg: /^\d?(12662|2266|268|11662|1662)/ },
    { cat: "Explorer II", reg: /^\d?(2265|2165|1657)/ }, 
    { cat: "Explorer 36", reg: /^\d?(12427|11427|1427)/ },
    { cat: "Sea-Dweller", reg: /^\d?(12660|11660|1660)/ },
    { cat: "1908", reg: /^\d?525/ },
    
    { cat: "Datejust 41mm", reg: /^\d?(1263|1163)/ },
    { cat: "Datejust 36mm", reg: /^\d?(1262|1162|162)/ },
    { cat: "Datejust 31mm", reg: /^\d?(278|178)/ },
    { cat: "Datejust 28mm", reg: /^\d?(279|179)/ },
    
    { cat: "Daytona", reg: /^\d?(1265|1165|1652)/ },
    { cat: "GMT", reg: /^\d?(1267|1167|167)/ },
    { cat: "Daydate", reg: /^\d?(128|228|118|218)/ },
    { cat: "Air-king", reg: /^\d?(1269|1169|1400)/ },
    
    { cat: "OP 41", reg: /^(1243|1143)/ },
    { cat: "OP 36", reg: /^(1260|1160)/ },
    { cat: "OP 34", reg: /^(1242|1142)/ },
    { cat: "OP 31", reg: /^(2772|1772)/ },
    { cat: "OP 28", reg: /^(2762)/ },
    
    { cat: "Sky-Dweller", reg: /^\d?336/ }, 
    { cat: "Land-Dweller", reg: /^\d?127/ },

    // === Patek Philippe 百達翡麗系列 ===
    { cat: "Aquanaut", reg: /^(516|526|596|796|507)/ },
    { cat: "Nautilus", reg: /^(572|574|599|711|571|7010|581|598)/ },
    { cat: "Complications", reg: /^(7234|5212|5961|5905|5524|5205|5930|5131|5396|4947|5235|5326)/ },
    { cat: "Grand Complications", reg: /^(5270|4948|5327|6104|6102|5236|6002|5204|5370|5160|5320|7140|5208|5178)/ },
    { cat: "Calatrava", reg: /^(5196|6119|5227|5226|7200|4997|4978|5088|6007|6196)/ },
    { cat: "Gondolo", reg: /^(7041|7099|4972|7042|4962|5098|5124|5200|4973)/ },
    { cat: "Golden Ellipse", reg: /^(5738)/ },
    { cat: "Twenty-4", reg: /^(4910|7300|7340)/ },

    // === Vacheron Constantin 江詩丹頓系列 ===
    { cat: "Vacheron Constantin", reg: /^(4520|81180|4600|4200|5520|7920|4605|1225|4000)/ },

    // === Audemars Piguet 愛彼系列 ===
    { cat: "Audemars Piguet", reg: /^(15210|15551|26240|26423|26650|26627|15468|26735|26585|15417|15510|77451|67650|77410)/ },

    // === Richard Mille 理查米爾系列 ===
    { cat: "Richard Mille", reg: /^RM/i }
];

function getWatchCategory(modelNum) {
    const cleanModel = modelNum.replace(/^[A-Za-z]{1,2}(?=\d)/, ''); 
    for (const rule of WATCH_RULES) {
        if (rule.reg.test(modelNum) || rule.reg.test(cleanModel)) {
            return rule.cat;
        }
    }
    return "other";
}

function getBatchWeight(batchStr) {
    if (!batchStr) return 0;
    let match = batchStr.match(/n(\d{1,2})(?:\/(\d{2,4}))?/i);
    if (match) {
        let month = parseInt(match[1], 10);
        let yearStr = match[2];
        let year = new Date().getFullYear(); // 改為動態獲取當前年份，避免未來失效
        if (yearStr) {
            year = parseInt(yearStr, 10);
            if (yearStr.length === 2) {
                year = 2000 + year; 
            }
        }
        return year * 100 + month;
    }
    return 0;
}

function processWatchData() {
    const rawText = document.getElementById('inputData').value;
    if (!rawText.trim()) {
        alert('請先輸入資料！');
        return;
    }

    let noEmojiText = rawText.replace(/[\u{1F300}-\u{1F9FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{1F1E6}-\u{1F1FF}]|[\u{1F004}]|[\u{1F0CF}]|[\u{1F170}-\u{1F251}]|[\u{1F700}-\u{1F77F}]|[\u{1F780}-\u{1F7FF}]|[\u{1F800}-\u{1F8FF}]|[\u{1FA00}-\u{1FA6F}]|[\u{1FA70}-\u{1FABF}]|[\u{1FAC0}-\u{1FAFF}]|[\u2500-\u2BFF]|[\u2022]|[\u2190-\u21FF]/gu, '');

    let cleanText = noEmojiText
        .replace(/HK\$/gi, ' HKD ')
        .replace(/\$/g, ' HKD ')
        .replace(/[:：]/g, ' ');

    const lines = cleanText.split('\n').map(l => l.trim());
    
    let categorizedData = {};
    WATCH_RULES.forEach(r => categorizedData[r.cat] = []);
    categorizedData["Tudor"] = [];
    categorizedData["Cartier"] = [];
    categorizedData["Patek Philippe"] = [];
    categorizedData["Vacheron Constantin Fallback"] = []; 
    categorizedData["Audemars Piguet Fallback"] = []; 
    categorizedData["Richard Mille Fallback"] = []; 
    categorizedData["other"] = [];

    let currentBrand = 'ROLEX';
    let rememberedBatch = ''; 

    lines.forEach(line => {
        if (!line || line.toUpperCase().includes('NEW COMING')) return;

        const upperLine = line.toUpperCase().trim();
        if (['TUDOR', 'ROLEX', 'CARTIER', 'PATEK PHILIPPE', 'PATEK', 'PP', 'VACHERON CONSTANTIN', 'VC', 'VACHERON', 'AUDEMARS PIGUET', 'AP', 'RICHARD MILLE', 'RM'].includes(upperLine)) {
            if (['PATEK PHILIPPE', 'PATEK', 'PP'].includes(upperLine)) currentBrand = 'PATEK PHILIPPE';
            else if (['VACHERON CONSTANTIN', 'VC', 'VACHERON'].includes(upperLine)) currentBrand = 'VACHERON CONSTANTIN';
            else if (['AUDEMARS PIGUET', 'AP'].includes(upperLine)) currentBrand = 'AUDEMARS PIGUET';
            else if (['RICHARD MILLE', 'RM'].includes(upperLine)) currentBrand = 'RICHARD MILLE';
            else currentBrand = upperLine;
            return;
        }

        let cleanLineBatch = line.replace(/HKD/gi, '').trim();
        if (/^[nN]\d+$/.test(cleanLineBatch)) {
            rememberedBatch = cleanLineBatch.toLowerCase(); 
            return; 
        }

        let isUsed = false;
        if (/\bused\b/i.test(line)) isUsed = true;

        let safeLine = line.replace(/(\d),(\d)/g, '$1$2');

        // 獨立萃取羅馬時標 (Dial Marker)
        let viMarker = '';
        if (/[0-9]viix\b/i.test(safeLine) || /[0-9]vi\s*ix\b/i.test(safeLine) || /\bviix\b/i.test(safeLine) || /\bvi\s+ix\b/i.test(safeLine)) {
            viMarker = 'viix';
        } else if (/[0-9]vi\b/i.test(safeLine) || /\bvi\b/i.test(safeLine)) {
            viMarker = 'vi';
        }
        safeLine = safeLine.replace(/([0-9])(?:viix|vi\s*ix|vi)\b/i, '$1');
        safeLine = safeLine.replace(/\b(viix|vi\s+ix|vi)\b/gi, ' ');

        let extractedMonthBatch = '';
        let lineForTokens = safeLine;

        let dateMatch = safeLine.match(/\b([nN]?\d{1,4})\s*[\/]\s*([nN]?\d{1,4})\b/);
        if (dateMatch) {
            let part1 = dateMatch[1];
            let part2 = dateMatch[2];
            let num1 = parseInt(part1.replace(/[nN]/g, ''), 10);
            let num2 = parseInt(part2.replace(/[nN]/g, ''), 10);
            let year = null;
            let month = null;
            
            if ((num1 >= 20 && num1 <= 30) || (num1 >= 2020 && num1 <= 2030)) {
                year = num1; month = num2;
            } else if ((num2 >= 20 && num2 <= 30) || (num2 >= 2020 && num2 <= 2030)) {
                year = num2; month = num1;
            }
            
            if (year !== null && month !== null && month >= 1 && month <= 12) {
                let fullYear = year < 100 ? 2000 + year : year;
                // 改良：強制保留所有年份，不因當前年份而省略，避免跨年排序錯亂
                extractedMonthBatch = `n${month}/${fullYear}`; 
                lineForTokens = safeLine.replace(dateMatch[0], ' ');
            }
        }

        const tokens = lineForTokens.split(/[\s,，\(\)]+/).map(t => t.trim()).filter(Boolean);
        
        let model = '';
        let lineBatch = '';
        let price = '';
        let quantity = ''; 
        let discount = '';
        let remainingTokens = [];

        tokens.forEach(token => {
            if (!model) {
                let isStandardModel = /^[A-Za-z]?\d{3,7}[A-Za-z0-9]*([\/\-][A-Za-z0-9]+)*$/.test(token);
                let isCartierModel = /^[A-Za-z][A-Za-z0-9]{1,3}\d{4,6}[A-Za-z0-9]*([\/\-][A-Za-z0-9]+)*$/.test(token);
                let isRMModel = /^RM\d+([\/\-][A-Za-z0-9]+)*$/i.test(token);
                
                if (isStandardModel || isCartierModel || isRMModel) model = token;
            }
        });

        if (!model && lineForTokens.trim().toUpperCase().startsWith('RM')) {
            let spaceTokens = lineForTokens.split(/\s+/);
            if(spaceTokens[0]) model = spaceTokens[0];
        }

        let detectedCat = model ? getWatchCategory(model) : "other";
        
        let isFullPriceFamily = [
            "Ballon Bleu", "Baignoire", "Panthere De Cartier", "Pasha De Cartier", "Ronde Must De Cartier", "Santos", "Tank",
            "Aquanaut", "Nautilus", "Complications", "Grand Complications", "Calatrava", "Gondolo", "Golden Ellipse", "Twenty-4",
            "Vacheron Constantin", "Audemars Piguet", "Richard Mille"
        ].includes(detectedCat) || ['CARTIER', 'PATEK PHILIPPE', 'VACHERON CONSTANTIN', 'AUDEMARS PIGUET', 'RICHARD MILLE'].includes(currentBrand);

        tokens.forEach(token => {
            if (token === model || token.toLowerCase() === 'unadj' || token.toLowerCase() === 'hkd' || /^RM$/i.test(token)) return;
            if (token === '-' || token === '/') return;
            if (token.toLowerCase() === 'used') return;
            if (/^\*\d+$/.test(token)) { quantity = token; return; }
            if (/^[+-]?\d+(\.\d+)?%$/.test(token)) { discount = `(${token})`; return; }
            if (/^[nN]\d+$/.test(token)) { lineBatch = token.toLowerCase(); return; }

            let cleanToken = token.replace(/,/g, '');
            let isPureNum = /^\d+(\.\d+)?$/.test(cleanToken);
            let hasK = /^\d+(\.\d+)?[k]$/.test(cleanToken.toLowerCase());

            // 改良：修復 K 單位換算邏輯
            if (isPureNum || hasK) {
                if (!price) {
                    let numVal = parseFloat(cleanToken.toLowerCase().replace('k', ''));
                    let actualValue = hasK ? numVal * 1000 : numVal;

                    if (isFullPriceFamily) {
                        price = `HK$${actualValue.toLocaleString('en-US')}`;
                    } else {
                        if (actualValue >= 1000) {
                            let kValue = parseFloat((actualValue / 1000).toFixed(2));
                            price = `HK$${kValue}k`;
                        } else if (actualValue > 0) {
                            price = `HK$${actualValue}`;
                        }
                    }
                }
                return;
            }
            if (['2026', '2025', '2024', '26', '25', '24'].includes(token)) return;
            remainingTokens.push(token);
        });

        if (model) {
            let detailStr = remainingTokens.join(' ');
            let braceletType = ''; // 獨立建立錶帶屬性

            if (detailStr) {
                // 1. 先標準化所有顏色與修飾字
                detailStr = detailStr.replace(/\bmint\s+green\b/gi, 'green');
                detailStr = detailStr.replace(/\b(blk|bk)\b/gi, 'black');
                detailStr = detailStr.replace(/\b(gn|grn)\b/gi, 'green');
                detailStr = detailStr.replace(/\b(choc|choco)\b/gi, 'cho');
                detailStr = detailStr.replace(/\b(wh|wht)\b/gi, 'white');
                detailStr = detailStr.replace(/\bomber\b/gi, 'ombre');
                detailStr = detailStr.replace(/\btb\b/gi, 'tiff');
                detailStr = detailStr.replace(/\b(pis|pista)\b/gi, 'pistachio');
                detailStr = detailStr.replace(/\blav\b/gi, 'lavender');
                detailStr = detailStr.replace(/\b(new|index|normal)\b/gi, '');
                detailStr = detailStr.replace(/\bcandy\b(?!\s*pink)/gi, '');
                
                // 2. 改良：獨立抽離錶帶型態，絕不與 detail 或時標字串混雜
                if (/\b(jub|jubilee)\b/i.test(detailStr)) {
                    braceletType = 'Jub';
                    detailStr = detailStr.replace(/\b(jub|jubilee)\b/gi, '');
                } else if (/\b(oys|oyster)\b/i.test(detailStr)) {
                    braceletType = 'Oys';
                    detailStr = detailStr.replace(/\b(oys|oyster)\b/gi, '');
                }
                
                detailStr = detailStr.replace(/\s+/g, ' ').trim();
            }

            let finalBatch = extractedMonthBatch || lineBatch || rememberedBatch;
            
            // 建立屬性完全分離的物件
            let itemObject = {
                model: model,
                dialColor: detailStr,       // 僅保留錶盤顏色等規格
                dialMarker: viMarker,       // 獨立保留羅馬字 (vi/viix)
                braceletType: braceletType, // 獨立保留錶帶 (Jub/Oys)
                batch: finalBatch,
                price: price,
                discount: discount,
                quantity: quantity,
                isUsed: isUsed
            };
            
            if (detectedCat === "other") {
                if (currentBrand === 'TUDOR') categorizedData["Tudor"].push(itemObject);
                else if (currentBrand === 'CARTIER') categorizedData["Cartier"].push(itemObject);
                else if (currentBrand === 'PATEK PHILIPPE') categorizedData["Patek Philippe"].push(itemObject);
                else if (currentBrand === 'VACHERON CONSTANTIN') categorizedData["Vacheron Constantin Fallback"].push(itemObject);
                else if (currentBrand === 'AUDEMARS PIGUET') categorizedData["Audemars Piguet Fallback"].push(itemObject);
                else if (currentBrand === 'RICHARD MILLE') categorizedData["Richard Mille Fallback"].push(itemObject);
                else categorizedData["other"].push(itemObject);
            } else {
                if (!categorizedData[detectedCat]) categorizedData[detectedCat] = [];
                categorizedData[detectedCat].push(itemObject);
            }
        }
    });

    let finalOutput = "";
    const displayOrder = [
        "1908", "Datejust 41mm", "Datejust 36mm", "Datejust 31mm", "Datejust 28mm", 
        "Daytona", "Submariner", "GMT", "Daydate", "Air-king", 
        "OP 41", "OP 36", "OP 34", "OP 31", "OP 28", 
        "Yacht-Master", "Explorer II", "Sky-Dweller", "Sea-Dweller", "DeepSea", "Land-Dweller", "Explorer 36", 
        "Monarch", "Tudor Royal", "Black Bay", "Black Bay 54", "Black Bay 58", 
        "Black Bay 68", "Black Bay one", "Black Bay chrono", "Pelagos", "Clair de rose", 
        "1926 Luna", "Black Bay GMT", "Black Bay Bronze", "Black Bay Pro", "Ranger",
        "Ballon Bleu", "Baignoire", "Panthere De Cartier", "Pasha De Cartier", "Ronde Must De Cartier", "Santos", "Tank",
        "Aquanaut", "Nautilus", "Complications", "Grand Complications", "Calatrava", "Gondolo", "Golden Ellipse", "Twenty-4",
        "Vacheron Constantin", "Audemars Piguet", "Richard Mille"
    ];

    displayOrder.forEach(catName => {
        if (categorizedData[catName] && categorizedData[catName].length > 0) {
            categorizedData[catName].sort((a, b) => {
                if (a.model > b.model) return -1;
                if (a.model < b.model) return 1;
                let weightA = getBatchWeight(a.batch);
                let weightB = getBatchWeight(b.batch);
                return weightA - weightB;
            });

            let linesResult = categorizedData[catName].map(item => {
                // 陣列化過濾並按固定順序組裝：型號 -> 顏色細節 -> 時標 -> 錶帶 -> 批次 -> 價格
                let lineStr = [item.model, item.dialColor, item.dialMarker, item.braceletType, item.batch, item.price, item.discount, item.quantity].filter(Boolean).join(' ');
                return item.isUsed ? "USED " + lineStr : lineStr;
            });

            finalOutput += catName + "\n" + linesResult.join('\n') + "\n\n";
        }
    });

    let extraBrands = [
        { key: "Cartier", label: "Cartier 其他" },
        { key: "Tudor", label: "Tudor 其他" },
        { key: "Patek Philippe", label: "Patek Philippe 其他" },
        { key: "Vacheron Constantin Fallback", label: "Vacheron Constantin 其他" },
        { key: "Audemars Piguet Fallback", label: "Audemars Piguet 其他" },
        { key: "Richard Mille Fallback", label: "Richard Mille 其他" },
        { key: "other", label: "other" }
    ];

    extraBrands.forEach(brand => {
        if (categorizedData[brand.key] && categorizedData[brand.key].length > 0) {
            let linesResult = categorizedData[brand.key].map(item => {
                let lineStr = [item.model, item.dialColor, item.dialMarker, item.braceletType, item.batch, item.price, item.discount, item.quantity].filter(Boolean).join(' ');
                return item.isUsed ? "USED " + lineStr : lineStr;
            });
            finalOutput += brand.label + "\n" + linesResult.join('\n') + "\n\n";
        }
    });

    document.getElementById('outputResult').innerText = finalOutput.trim() || "未辨識到有效錶款資料。";
}

function copyResult() {
    const text = document.getElementById('outputResult').innerText;
    if (text === "等待整理資料..." || text === "未辨識到有效錶款資料。") {
        alert("沒有可複製的資料！");
        return;
    }

    const fallbackCopy = (textToCopy) => {
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        textArea.style.position = "fixed";
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
            const successful = document.execCommand('copy');
            if (successful) {
                alert("已成功複製到剪貼簿！");
            } else {
                alert("瀏覽器阻擋了複製功能，請手動全選複製。");
            }
        } catch (err) {
            alert("複製失敗，請手動全選複製。");
        }
        document.body.removeChild(textArea);
    };

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
            alert("已成功複製到剪貼簿！");
        }).catch(err => {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}
</script>

</body>
